name: Personal fork checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: travel-planner-fe
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: travel-planner-fe/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
