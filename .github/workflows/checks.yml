name: Personal fork checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: travel-planner-fe
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: travel-planner-fe/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser
      - name: Scan published files for credentials
        run: >-
          docker run --rm --network none --read-only
          -v "$PWD/out:/scan:ro"
          ghcr.io/gitleaks/gitleaks:v8.30.1
          dir /scan --redact=100 --no-banner
